name: Build & Test REWIND

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3
      with:
        ffmpeg-version: release

    - name: Restore Dependencies
      run: dotnet restore Rewind.sln

    - name: Build Solution
      run: dotnet build Rewind.sln -c Release --no-restore

    - name: Run Automated Tests
      run: dotnet test Rewind.sln -c Release --no-build --verbosity normal

    - name: Publish Standalone Release Binary
      run: dotnet publish Rewind.App/Rewind.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./release

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: REWIND-Windows-x64
        path: ./release/
